# =============================================================================
#  jaskier_door_lock — variant B — FOUR independent 12 V actuator door locks
#  on one board and one ESP.
# -----------------------------------------------------------------------------
#  U1     ESP32-S3-DevKitC-1              logic + Home Assistant API
#         (variant A's ESP32-C3-Zero has ~11 usable GPIOs; four bridges plus
#          eight switches and four buttons need ~23, so the S3 it is)
#  U2a-d  DRV8871 breakout (Adafruit)     one H-bridge per door
#  U3a-d  INA219 (0.1 R shunt)            one per door, shared I2C bus,
#                                         addresses 0x40 / 0x41 / 0x44 / 0x45
#  U4     MH-MINI-360 (MP1584EN)          12 V -> 5.0 V for U1
#  BAT    LiFePO4 4S, 12.8 V nom (10.0-14.6 V)
#
#  Each door runs the exact same current-based state machine as variant A —
#  see door_lock_a.yaml and packages/door.yaml. Doors are fully independent:
#  separate lock entity, thresholds, fault latch, watchdog. Any or all four
#  can move at the same time ("close all" is just four lock calls from HA).
#
#  Power note: four actuators stalling together draw ~2 A plus inrush —
#  fuse the common rail accordingly (5 A slow-blow suggested, see README).
# =============================================================================

substitutions:
  device_name: jaskier-door-lock-b
  friendly: Door locks

  # ---- shared pins ---------------------------------------------------------
  pin_sda: GPIO8          # all four INA219s on one bus
  pin_scl: GPIO9
  pin_rgb: GPIO48         # on-board WS2812 (GPIO38 on some DevKitC-1 revisions)

  # Per-door pins are passed to packages/door.yaml in the `packages:` block
  # at the bottom of this file. Summary:
  #
  #   door   IN1     IN2     SW-locked  SW-unlocked  button   INA219
  #   1      GPIO4   GPIO5   GPIO10     GPIO11       GPIO39   0x40 (A1/A0 open)
  #   2      GPIO6   GPIO7   GPIO12     GPIO13       GPIO40   0x41 (A0 bridged)
  #   3      GPIO15  GPIO16  GPIO14     GPIO21       GPIO41   0x44 (A1 bridged)
  #   4      GPIO17  GPIO18  GPIO1      GPIO2        GPIO42   0x45 (A0+A1 bridged)
  #
  # Avoided on purpose: GPIO0/3/45/46 (strapping), GPIO19/20 (USB),
  # GPIO43/44 (UART0), GPIO35-37 (octal-PSRAM boards).

esphome:
  name: ${device_name}
  friendly_name: ${friendly}
  min_version: 2024.6.0
  project:
    name: mswietlicki.jaskier_door_lock_b
    version: "1.1.0"
  on_boot:
    # Belt-and-braces: the 10 k pull-downs on every IN pin hold all four
    # bridges off during reset; this makes sure firmware agrees as soon as
    # the outputs exist.
    - priority: 600
      then:
        - script.execute: d1_coast
        - script.execute: d2_coast
        - script.execute: d3_coast
        - script.execute: d4_coast
        - lambda: |-
            id(d1_fault_reason) = "boot"; id(d1_mv_running) = false;
            id(d2_fault_reason) = "boot"; id(d2_mv_running) = false;
            id(d3_fault_reason) = "boot"; id(d3_mv_running) = false;
            id(d4_fault_reason) = "boot"; id(d4_mv_running) = false;
        - script.execute: d1_publish_lock_state
        - script.execute: d2_publish_lock_state
        - script.execute: d3_publish_lock_state
        - script.execute: d4_publish_lock_state
  on_shutdown:
    # Cancel every delayed motion path before GPIO teardown.
    - priority: 700
      then:
        - script.stop: d1_cmd
        - script.stop: d2_cmd
        - script.stop: d3_cmd
        - script.stop: d4_cmd
        - script.stop: d1_move_actuator
        - script.stop: d2_move_actuator
        - script.stop: d3_move_actuator
        - script.stop: d4_move_actuator
        - script.stop: d1_finish_fault
        - script.stop: d2_finish_fault
        - script.stop: d3_finish_fault
        - script.stop: d4_finish_fault
        - script.stop: d1_finish_ok
        - script.stop: d2_finish_ok
        - script.stop: d3_finish_ok
        - script.stop: d4_finish_ok
        - script.stop: d1_energize
        - script.stop: d2_energize
        - script.stop: d3_energize
        - script.stop: d4_energize
        - script.stop: d1_jog_unlock
        - script.stop: d2_jog_unlock
        - script.stop: d3_jog_unlock
        - script.stop: d4_jog_unlock
        - script.stop: d1_jog_lock
        - script.stop: d2_jog_lock
        - script.stop: d3_jog_lock
        - script.stop: d4_jog_lock
        # Shutdown automations must not wait on scheduled scripts: drive every
        # bridge input low synchronously so reboot cannot be held up.
        - output.turn_off: d1_drv_in1
        - output.turn_off: d1_drv_in2
        - output.turn_off: d2_drv_in1
        - output.turn_off: d2_drv_in2
        - output.turn_off: d3_drv_in1
        - output.turn_off: d3_drv_in2
        - output.turn_off: d4_drv_in1
        - output.turn_off: d4_drv_in2
        - lambda: |-
            id(d1_mv_energized) = false;
            id(d2_mv_energized) = false;
            id(d3_mv_energized) = false;
            id(d4_mv_energized) = false;

esp32:
  board: esp32-s3-devkitc-1
  framework:
    type: esp-idf

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG   # logs over the USB-C socket

api:
  encryption:
    key: !secret api_encryption_key
  on_client_disconnected:
    - if:
        condition:
          lambda: |-
            return id(d1_mv_running) || id(d2_mv_running) ||
                   id(d3_mv_running) || id(d4_mv_running);
        then:
          - logger.log: "API lost while a door is moving - continuing, moves are self-limiting"

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${device_name}-setup
    password: !secret ap_password

captive_portal:

i2c:
  sda: ${pin_sda}
  scl: ${pin_scl}
  frequency: 400kHz
  scan: true

# =============================================================================
#  shared sensors
#  All four INA219s hang off the same +12 V rail, so pack voltage comes from
#  door 1's chip alone.
# =============================================================================
sensor:
  - platform: template
    name: "${friendly} supply voltage"
    id: supply_voltage
    unit_of_measurement: V
    device_class: voltage
    state_class: measurement
    accuracy_decimals: 2
    update_interval: 60s
    lambda: 'return id(d1_bus_voltage).state;'
    filters:
      - delta: 0.05

# =============================================================================
#  status LED (on-board WS2812) — aggregate across all four doors:
#  red = any fault latched | white = any door moving | off = all quiet.
#  Per-door scripts still flash green on success.
# =============================================================================
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: ${pin_rgb}
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
    restore_mode: ALWAYS_OFF

script:
  - id: led_update
    mode: restart
    then:
      - lambda: |-
          const bool fault = id(d1_lock_fault).state || id(d2_lock_fault).state ||
                             id(d3_lock_fault).state || id(d4_lock_fault).state;
          const bool moving = id(d1_mv_running) || id(d2_mv_running) ||
                              id(d3_mv_running) || id(d4_mv_running);
          if (fault) {
            auto call = id(status_led).turn_on();
            call.set_brightness(0.35f);
            call.set_rgb(1.0f, 0.0f, 0.0f);
            call.perform();
          } else if (moving) {
            auto call = id(status_led).turn_on();
            call.set_brightness(0.25f);
            call.set_rgb(1.0f, 1.0f, 1.0f);
            call.perform();
          } else {
            id(status_led).turn_off().perform();
          }

# =============================================================================
#  the four doors — everything per-door lives in packages/door.yaml
# =============================================================================
packages:
  door1: !include
    file: packages/door.yaml
    vars:
      door: d1
      door_friendly: "Door 1"
      pin_in1: GPIO4
      pin_in2: GPIO5
      pin_sw_locked: GPIO10
      pin_sw_unlocked: GPIO11
      pin_button: GPIO39
      ina_address: "0x40"
  door2: !include
    file: packages/door.yaml
    vars:
      door: d2
      door_friendly: "Door 2"
      pin_in1: GPIO6
      pin_in2: GPIO7
      pin_sw_locked: GPIO12
      pin_sw_unlocked: GPIO13
      pin_button: GPIO40
      ina_address: "0x41"
  door3: !include
    file: packages/door.yaml
    vars:
      door: d3
      door_friendly: "Door 3"
      pin_in1: GPIO15
      pin_in2: GPIO16
      pin_sw_locked: GPIO14
      pin_sw_unlocked: GPIO21
      pin_button: GPIO41
      ina_address: "0x44"
  door4: !include
    file: packages/door.yaml
    vars:
      door: d4
      door_friendly: "Door 4"
      pin_in1: GPIO17
      pin_in2: GPIO18
      pin_sw_locked: GPIO1
      pin_sw_unlocked: GPIO2
      pin_button: GPIO42
      ina_address: "0x45"
