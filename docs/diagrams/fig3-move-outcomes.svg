<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 360" role="img" aria-label="Four current-versus-time panels. Panel one: current collapses to near zero, verdict success. Panel two: current rises to stall after the minimum travel time, verdict end of stroke. Panel three: current rises to stall before the minimum travel time, verdict jam. Panel four: current never changes, verdict timeout.">
  <title>Figure 3 - How a move ends</title>
  <style>
    svg {
      --ink:#121A1F; --ink-2:#3B474E; --muted:#5B686F;
      --surface:#FFFFFF; --surface-2:#F3F6F7; --line:#CFD9DE; --line-soft:#E1E8EB;
      --w12:#C4322A; --w5:#D07B22; --w33:#A03D86; --wgnd:#3E4A51;
      --wi2c:#1E6FAF; --wctrl:#2A7F4F; --wmot:#6A4CA0;
      --ok:#2A7F4F; --warn:#B07A10; --bad:#B8332A;
      --font-display:"Bahnschrift SemiCondensed","Bahnschrift","DIN Alternate","Segoe UI Semibold","Segoe UI",sans-serif;
      --font-body:"Segoe UI",Corbel,system-ui,sans-serif;
      --font-mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,monospace;
      background:#FFFFFF; color:var(--ink);
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --ink:#E6ECEF; --ink-2:#BCC7CD; --muted:#8B989F;
        --surface:#151C21; --surface-2:#1B242A; --line:#28343B; --line-soft:#202B31;
        --w12:#E8635A; --w5:#E9A54A; --w33:#D174B7; --wgnd:#93A2AA;
        --wi2c:#58A8E4; --wctrl:#57BE85; --wmot:#A78BDC;
        --ok:#57BE85; --warn:#E0B44A; --bad:#F0736A;
        background:#151C21;
      }
    }
    .box   { fill:var(--surface-2); stroke:var(--ink); stroke-width:1.6; }
    .comp  { fill:var(--surface); stroke:var(--ink); stroke-width:1.5; }
    .pad   { fill:var(--ink); stroke:none; }
    .padnc { fill:var(--surface); stroke:var(--muted); stroke-width:1.3; }
    .t     { font-family:var(--font-mono); font-size:12.5px; fill:var(--ink); }
    .tt    { font-family:var(--font-display); font-size:15px; font-weight:600; letter-spacing:0.04em; fill:var(--ink); }
    .ts    { font-family:var(--font-body); font-size:11.5px; fill:var(--muted); }
    .tn    { font-family:var(--font-mono); font-size:11px; fill:var(--muted); }
    .w     { fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
    .rail  { stroke-width:3.6; fill:none; stroke-linecap:round; }
    .w12   { stroke:var(--w12); }
    .w5    { stroke:var(--w5); }
    .w33   { stroke:var(--w33); }
    .wgnd  { stroke:var(--wgnd); }
    .wi2c  { stroke:var(--wi2c); }
    .wctrl { stroke:var(--wctrl); }
    .wmot  { stroke:var(--wmot); stroke-width:2.8; }
    .axis  { stroke:var(--muted); stroke-width:1.2; fill:none; }
    .thr   { stroke:var(--muted); stroke-width:1; stroke-dasharray:4 4; fill:none; }
    .trace { fill:none; stroke-width:2.4; stroke-linejoin:round; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="currentColor"/>
    </marker>
  </defs>
        <!-- panel 1 -->
        <g>
          <text class="tt" x="20" y="24" font-size="13">① LIMIT SWITCH OPENS</text>
          <line class="axis" x1="20" y1="60" x2="20" y2="240"/>
          <line class="axis" x1="20" y1="240" x2="290" y2="240"/>
          <line class="thr" x1="20" y1="100" x2="290" y2="100"/>
          <line class="thr" x1="20" y1="222" x2="290" y2="222"/>
          <line class="thr" x1="140" y1="60" x2="140" y2="240"/>
          <text class="tn" x="294" y="104">stall</text>
          <text class="tn" x="294" y="226">idle</text>
          <text class="tn" x="142" y="56">t_min</text>
          <polyline class="trace" stroke="var(--ok)" points="24,238 34,66 52,152 210,152 222,232 288,232"/>
          <text class="ts" x="20" y="272">Current collapses — the actuator's internal</text>
          <text class="ts" x="20" y="290">switch cut the motor at end of stroke.</text>
          <text class="t"  x="20" y="318" fill="var(--ok)">→ LOCKED / UNLOCKED</text>
        </g>
        <!-- panel 2 -->
        <g>
          <text class="tt" x="330" y="24" font-size="13">② HARD STOP, LATE</text>
          <line class="axis" x1="330" y1="60" x2="330" y2="240"/>
          <line class="axis" x1="330" y1="240" x2="600" y2="240"/>
          <line class="thr" x1="330" y1="100" x2="600" y2="100"/>
          <line class="thr" x1="330" y1="222" x2="600" y2="222"/>
          <line class="thr" x1="450" y1="60" x2="450" y2="240"/>
          <text class="tn" x="604" y="104">stall</text>
          <text class="tn" x="604" y="226">idle</text>
          <text class="tn" x="452" y="56">t_min</text>
          <polyline class="trace" stroke="var(--ok)" points="334,238 344,66 362,152 510,152 526,86 588,86"/>
          <text class="ts" x="330" y="272">No internal switch: the bolt simply reaches</text>
          <text class="ts" x="330" y="290">its stop. Late stall = a normal stop.</text>
          <text class="t"  x="330" y="318" fill="var(--ok)">→ LOCKED / UNLOCKED</text>
        </g>
        <!-- panel 3 -->
        <g>
          <text class="tt" x="640" y="24" font-size="13">③ HARD STOP, EARLY</text>
          <line class="axis" x1="640" y1="60" x2="640" y2="240"/>
          <line class="axis" x1="640" y1="240" x2="910" y2="240"/>
          <line class="thr" x1="640" y1="100" x2="910" y2="100"/>
          <line class="thr" x1="640" y1="222" x2="910" y2="222"/>
          <line class="thr" x1="760" y1="60" x2="760" y2="240"/>
          <text class="tn" x="914" y="104">stall</text>
          <text class="tn" x="914" y="226">idle</text>
          <text class="tn" x="762" y="56">t_min</text>
          <polyline class="trace" stroke="var(--bad)" points="644,238 654,66 672,152 700,152 714,86 742,86"/>
          <polyline class="trace" stroke="var(--bad)" stroke-dasharray="5 4" points="742,86 756,150 810,150 822,232 890,232" marker-end="url(#ar)" color="var(--bad)"/>
          <text class="ts" x="640" y="272">Something is in the way. Coast, wait, then</text>
          <text class="ts" x="640" y="290">drive back out for as long as it drove in.</text>
          <text class="t"  x="640" y="318" fill="var(--bad)">→ JAMMED + alert</text>
        </g>
        <!-- panel 4 -->
        <g>
          <text class="tt" x="950" y="24" font-size="13">④ NOTHING HAPPENS</text>
          <line class="axis" x1="950" y1="60" x2="950" y2="240"/>
          <line class="axis" x1="950" y1="240" x2="1220" y2="240"/>
          <line class="thr" x1="950" y1="100" x2="1220" y2="100"/>
          <line class="thr" x1="950" y1="222" x2="1220" y2="222"/>
          <line class="thr" x1="1070" y1="60" x2="1070" y2="240"/>
          <text class="tn" x="1150" y="56">t_max</text>
          <line class="thr" x1="1196" y1="60" x2="1196" y2="240"/>
          <polyline class="trace" stroke="var(--bad)" points="954,238 964,66 982,152 1196,152"/>
          <text class="ts" x="950" y="272">Neither threshold reached before t_max —</text>
          <text class="ts" x="950" y="290">slipping clutch, broken linkage, bad wiring.</text>
          <text class="t"  x="950" y="318" fill="var(--bad)">→ JAMMED + alert</text>
        </g>
      </svg>
